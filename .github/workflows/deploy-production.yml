name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g. v1.2.3) to deploy'
        required: true
        default: 'v1.0.0'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=${GITHUB_REF_NAME}
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=true

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: production
      url: https://cycleparadise.bike

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION: ${{ needs.build-image.outputs.version }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}   # pins the server host key
          envs: VERSION,POSTGRES_PASSWORD,SESSION_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,CONTACT_EMAIL,PUBLIC_SITE_URL
          script: |
            set -euo pipefail
            umask 077

            echo "Deploying version: $VERSION"

            cd /opt/cycleparadise
            git config --global --add safe.directory /opt/cycleparadise

            # Pre-deploy database backup (kept 14 days). NEVER remove volumes: they hold the database.
            mkdir -p "$HOME/db-backups"
            if docker ps --format '{{.Names}}' | grep -qx cycleparadise-postgres; then
              docker exec cycleparadise-postgres pg_dump -U cycleparadise cycleparadise | gzip > "$HOME/db-backups/pre_${VERSION}_$(date +%s).sql.gz" || echo "WARN: pre-deploy backup failed"
            fi
            find "$HOME/db-backups" -name '*.sql.gz' -mtime +14 -delete 2>/dev/null || true

            git reset --hard HEAD
            git clean -ffdx
            git fetch --all --tags --force
            git checkout --force "$VERSION"

            # Escape dollar signs in password for Docker Compose variable interpolation
            ESCAPED_PASSWORD=$(echo "${POSTGRES_PASSWORD}" | sed 's/\$/\$\$/g')
            
            # URL-encode the password for PostgreSQL connection string
            URL_ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${POSTGRES_PASSWORD}', safe=''))")
            
            cat > .env <<EOF
            DB_USER=cycleparadise
            DB_PASSWORD=${ESCAPED_PASSWORD}
            DB_NAME=cycleparadise
            DATABASE_URL="postgresql://cycleparadise:${URL_ENCODED_PASSWORD}@db:5432/cycleparadise?schema=public"
            DIRECT_URL="postgresql://cycleparadise:${URL_ENCODED_PASSWORD}@db:5432/cycleparadise?schema=public"
            SESSION_SECRET=${SESSION_SECRET}
            NODE_ENV=production
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASS}
            FROM_EMAIL=noreply@cycleparadise.bike
            ADMIN_EMAIL=admin@cycleparadise.bike
            CONTACT_EMAIL=${CONTACT_EMAIL}
            PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
            IMAGE_QUALITY=80
            MAX_IMAGE_SIZE=2048
            EOF
            chmod 600 .env

            export COMPOSE_PROJECT_NAME=cycleparadise
            C="docker compose --env-file .env -f docker-compose.yml -f docker-compose.edge.yml"

            $C build
            $C up -d --remove-orphans

            # Wait for the web container to report healthy (migrations run first via the migrator service)
            for i in $(seq 1 30); do
              st=$(docker inspect -f '{{.State.Health.Status}}' cycleparadise-web 2>/dev/null || echo none)
              [ "$st" = "healthy" ] && break
              sleep 5
            done
            if [ "$st" != "healthy" ]; then
              echo "ERROR: web container is not healthy (status=$st)"
              $C logs --tail 80 web migrator
              exit 1
            fi

            echo "Deployment completed successfully"
            $C ps
            docker image prune -f

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for rollout
        run: sleep 15

      - name: Check homepage
        run: |
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://cycleparadise.bike)
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status: $STATUS" && exit 1
          fi

      - name: Check health endpoint
        run: |
          curl -sfL https://cycleparadise.bike/health > /dev/null
